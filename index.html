<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopBase</title>
    <script>
      (function () {
        var s = localStorage.getItem('shopbase-theme');
        var t = 'system';
        if (s) { try { t = JSON.parse(s).state?.theme || 'system'; } catch (e) {} }
        var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
    <!-- Iubenda Consent Solution (CMP) — sostituire IUBENDA_SITE_ID e IUBENDA_COOKIE_POLICY_ID con i valori reali dalla dashboard Iubenda > Privacy Controls and Cookie Solution > Implementa -->
    <script type="text/javascript">
      var _iub = _iub || [];
      _iub.csConfiguration = {
        siteId: 430676,
        cookiePolicyId: 23532675,
        lang: "auto",
        storage: { useSiteId: true },
        banner: {
          acceptButtonDisplay: true,
          customizeButtonDisplay: true,
          rejectButtonDisplay: true,
          position: "bottom",
          slideDown: false,
        },
        callback: {
          onConsentGiven: function () {
            window.dispatchEvent(new Event("iubenda:consent:given"));
          },
          onConsentRejected: function () {
            window.dispatchEvent(new Event("iubenda:consent:rejected"));
          },
        },
      };
    </script>
    <script type="text/javascript" src="//cdn.iubenda.com/cs/iubenda_cs.js" charset="UTF-8" async></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
