<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to a
         real value; without it every safe-area padding in the stylesheet is 0
         and content sits under the home indicator on notched phones. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AURUM</title>
    <meta name="description" content="A considered selection of products made to inspire, to simplify, and to last." />
    <!-- Light is the store's default, so the browser chrome starts on paper and
         is repainted by theme-init.js only for a visitor who chose dark. -->
    <meta name="theme-color" content="#F7F5F1" />

    <!-- The display serif carries the first line the visitor reads, so it is
         fetched alongside the document instead of after the stylesheet. -->
    <link rel="preload" href="/fonts/instrument-serif-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- External file (not inline) so the CSP can stay script-src 'self' -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
